# Experiment 1: Architecture Search on neck
neck_grid_search:
  neck:
    BiGRU:
      hidden_dim: [128, 256]
      num_layers: [1, 2]
    TCNNeck:
      num_channels:
        - [128, 256]
        - [256, 512]
        - [128, 256, 512]
      kernel_size: [3, 5]
  head:
    MeanPooling: {}
  loss:
    CrossEntropy: {}
  optimizer:
    lr: [5e-4]
    weight_decay: [0.0]

# Experiment 2: regularization
neck_grid_search_regularized:
  neck:
    BiGRU:
      hidden_dim: [128, 256]
      num_layers: [1, 2]
    TCNNeck:
      num_channels:
        - [128, 256]
        - [256, 512]
        - [128, 256, 512]
      kernel_size: [3, 5]
  head:
    MeanPooling: {}
  loss:
    CrossEntropy: {}
  optimizer:
    lr: [5e-4]
    weight_decay: [1e-3, 1e-4]

# Rationale: in previous runs BiGRU was better, so for simplicity here I'll use just BiGRU
#   The train-val curves all showed the same behaviour: smooth minimized loss and rough
#   validation loss. The instability on the latter makes me think that LR is too high
#   dropout was inserted for testing purposes.
#   NOTE: it seems that LR should be lowered for latter architecture components, that's
#         what i'm testing here.
neck_grid_search_regularized_dropout:
  neck:
    BiGRU:
      hidden_dim: [128, 256]
      num_layers: [1, 2]
      dropout: [0.2]
  head:
    MeanPooling: {}
  loss:
    CrossEntropy: {}
  optimizer:
    lr: [1e-4, 5e-5]
    weight_decay: [1e-4]

# Experiment 5: optimize neck for p1 and p2 (to use with specific metadata)
neck_regularized_dropout_p1_p2:
  neck:
    BiGRU:
      hidden_dim: [128, 256]
      num_layers: [1, 2]
      dropout: [0.2]
    TCNNeck:
      num_channels:
